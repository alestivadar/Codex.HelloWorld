<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A Hello World webpage styled with Tailwind CSS." />
  <title>Hello World | Tailwind CSS</title>
  <!-- Tailwind CSS browser build: convenient for a first test, not production. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-6">
  <main class="w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900 p-8 text-center shadow-2xl">
    <p class="mb-4 text-sm font-semibold uppercase tracking-widest text-sky-400">My first Tailwind CSS webpage</p>
    <h1 class="mb-4 text-4xl font-extrabold tracking-tight sm:text-5xl">Hello World! 👋</h1>
    <p class="mb-8 text-slate-300">This page is hosted in my GitHub repository and styled with Tailwind CSS.</p>
    <button id="helloButton" type="button" class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white shadow-lg transition hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400 active:scale-95">
      Click me
    </button>
    <p id="message" role="status" aria-live="polite" class="mt-5 min-h-6 text-emerald-400"></p>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", () => {
      document.getElementById("message").textContent = "It works! 🎉";
    });
  </script>
</body>
</html>
