<html lang="en">
<head>

  <meta name="theme-color" content="#071624">
  <meta name="description" content="Choose a game to play.">
  <title>Game Gallery</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html,body{margin:0;min-height:100%;background:#071624;color:#f2fbff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{display:block;overflow:hidden;border:1px solid #2e5268;background:#112b3d;border-radius:22px;text-decoration:none;color:inherit;box-shadow:0 16px 40px #0005;transition:transform .2s,border-color .2s}
    .card:hover{transform:translateY(-3px);border-color:#67e8f9}
    .card:focus-visible{outline:3px solid #67e8f9;outline-offset:5px}
    .preview{position:relative;aspect-ratio:16/10;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1b5264 0%,#0b2539 75%)}
    .court-lines{position:absolute;inset:57% -20% -22%;border-top:5px solid #43a6a5;background:linear-gradient(180deg,#164758,#143749);transform:perspective(400px) rotateX(15deg)}
    .hoop{position:absolute;right:12%;top:24%;height:48%;width:10px;background:#b8d5df;border:2px solid #fff3;border-radius:3px}
    .board{position:absolute;right:12%;top:22%;width:13%;height:25%;border:5px solid #deeff6;background:#b8d5df15;border-radius:3px}
    .rim{position:absolute;right:13%;top:44%;width:18%;height:8px;border-radius:100%;border:4px solid #f9783b;transform:rotate(-2deg)}
    .net{position:absolute;right:17%;top:48%;width:10%;height:15%;border:2px dashed #b9eff8b0;border-top:0;clip-path:polygon(0 0,100% 0,75% 100%,25% 100%);transform:perspective(80px) rotateX(18deg)}
    .spectator{position:absolute;left:7%;top:13%;width:31%;height:66%;object-fit:cover;object-position:center 44%;border:3px solid #ffb9d5;border-radius:16px;box-shadow:0 10px 24px #0008}
    .ball{position:absolute;left:49%;top:45%;font-size:clamp(32px,9vw,64px);filter:drop-shadow(0 5px 7px #0008);transform:rotate(-17deg)}
    .spark{position:absolute;left:65%;top:30%;font-size:clamp(14px,3vw,25px);color:#facc15}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
