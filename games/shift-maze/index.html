<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080f19">
<meta name="description" content="A shifting labyrinth with touch joystick controls.">
<title>Shift Maze</title>
<style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#080f19}
body{display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,sans-serif}
#game{width:100%;height:100vh;height:100dvh;max-width:570px;max-height:840px;display:flex;flex-direction:column;overflow:hidden;background:#f3f7fb;border:0;position:relative}
#board{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#fafafa}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;right:12px;top:12px;width:42px;height:42px;pointer-events:none;filter:drop-shadow(0 3px 5px #0004)}
#controls{height:clamp(126px,21dvh,166px);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#0d1a28;box-shadow:0 -5px 15px #0002;touch-action:none;padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
#stick{position:relative;width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,#243e54,#14283a);border:2px solid #52718a;box-shadow:inset 0 7px 20px #0006,0 8px 18px #0004;touch-action:none;user-select:none;-webkit-user-select:none}
#stick:before,#stick:after{content:"";position:absolute;pointer-events:none;background:#87aac055}
#stick:before{height:1px;width:80%;top:50%;left:10%}#stick:after{width:1px;height:80%;left:50%;top:10%}
#knob{position:absolute;left:50%;top:50%;width:57px;height:57px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 34% 28%,#b4eaff,#2c87b8 67%,#1a4c76);border:3px solid #92d8f7;box-shadow:0 6px 16px #0007;pointer-events:none}
#blast{position:absolute;right:clamp(12px,6%,36px);top:50%;transform:translateY(-50%);width:72px;height:72px;display:grid;place-items:center;border-radius:50%;border:2px solid #ffb35f;background:radial-gradient(circle at 35% 25%,#ef9b3c,#a23e20);box-shadow:0 5px 18px #0008;color:#fff;font-size:30px;touch-action:manipulation;cursor:pointer}
#blast:active{transform:translateY(-50%) scale(.94)}#blast:disabled{opacity:.35;filter:grayscale(1);cursor:default}
#ammo{position:absolute;bottom:-15px;display:flex;gap:8px}#ammo i{width:10px;height:10px;border-radius:50%;background:#ffb35f;box-shadow:0 0 7px #ffc86b}#ammo i.empty{background:#526170;box-shadow:none}
#announce{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(min-width:700px){#game{height:min(840px,calc(100dvh - 24px));border:1px solid #2a4c65;border-radius:18px;box-shadow:0 24px 65px #0009}}
@media(max-height:510px){#controls{height:100px}#stick{width:86px;height:86px}#knob{width:44px;height:44px}#hud{width:32px;height:32px}#blast{width:57px;height:57px;font-size:24px}}
</style>
</head>
<body>
<main id="game" aria-label="Shift Maze game">
<div id="board" aria-label="Random maze. Guide the blue player to the glowing green destination.">
<canvas id="maze"></canvas><canvas id="hud" width="100" height="100" aria-hidden="true"></canvas>
</div>
<div id="controls"><div id="stick" role="group" aria-label="Movement joystick"><div id="knob"></div></div><button id="blast" type="button" aria-label="Explode nearby walls, 2 charges remaining">💥<span id="ammo" aria-hidden="true"><i></i><i></i></span></button></div>
<div id="announce" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{
'use strict';
const board=document.getElementById('board'),canvas=document.getElementById('maze'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),g=hud.getContext('2d'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),blast=document.getElementById('blast'),ammoDisplay=document.getElementById('ammo'),announce=document.getElementById('announce');
const N=1,E=2,S=4,WEST=8,PERIOD=10,WARNING=3;
const directions=[[0,-1,N,S],[1,0,E,WEST],[0,1,S,N],[-1,0,WEST,E]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let width=0,height=0,cols=17,rows=23,tileW=1,tileH=1,walls=new Uint8Array(0);
let player={x:.5,y:.5},goal={x:16.5,y:22.5};
let joystick={x:0,y:0},pointer=null,keys=new Set(),elapsed=0,celebrate=0,particles=[],last=0,ammo=2,blastWave=0;
const cell=(x,y)=>y*cols+x,inside=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows;
function generateMaze(){
  // A perfect spanning-tree maze connects every cell, so both the player's
  // current cell and the fixed goal remain reachable after every reshuffle.
  walls=new Uint8Array(cols*rows).fill(15);
  const visited=new Uint8Array(cols*rows);
  const startX=clamp(Math.floor(player.x),0,cols-1),startY=clamp(Math.floor(player.y),0,rows-1);
  const stack=[[startX,startY]];
  visited[cell(startX,startY)]=1;
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const options=directions.filter(([dx,dy])=>inside(x+dx,y+dy)&&!visited[cell(x+dx,y+dy)]);
    if(!options.length){stack.pop();continue;}
    const [dx,dy,bit,opposite]=options[Math.floor(Math.random()*options.length)];
    const nx=x+dx,ny=y+dy;
    walls[cell(x,y)]&=~bit;
    walls[cell(nx,ny)]&=~opposite;
    visited[cell(nx,ny)]=1;stack.push([nx,ny]);
  }
  // A few shortcuts make the labyrinth feel different and less predictable.
  for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){
    if(Math.random()>.035)continue;
    const dir=Math.random()<.5?directions[1]:directions[2];
    const [dx,dy,bit,opposite]=dir,nx=x+dx,ny=y+dy;
    walls[cell(x,y)]&=~bit;
    walls[cell(nx,ny)]&=~opposite;
  }
  // A maze may shift while the player is crossing an old doorway.
  // Clear any newly spawned wall segment touching the player's actual circle,
  // without changing its precise position or the goal.
  const safetyRadius=.33;
  function nearSegment(ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay;
    const t=clamp(((player.x-ax)*dx+(player.y-ay)*dy)/(dx*dx+dy*dy),0,1);
    return Math.hypot(player.x-(ax+dx*t),player.y-(ay+dy*t))<safetyRadius;
  }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(x<cols-1 && nearSegment(x+1,y,x+1,y+1))removeWall(x,y,E);
    if(y<rows-1 && nearSegment(x,y+1,x+1,y+1))removeWall(x,y,S);
  }
  elapsed=0;
}
function removeWall(x,y,bit){
  const nx=x+(bit===E?1:bit===WEST?-1:0);
  const ny=y+(bit===S?1:bit===N?-1:0);
  if(!inside(x,y)||!inside(nx,ny))return false;
  const opposite=bit===N?S:bit===S?N:bit===E?WEST:E;
  const present=!!(walls[cell(x,y)]&bit);
  walls[cell(x,y)]&=~bit;walls[cell(nx,ny)]&=~opposite;
  return present;
}
function refreshAmmo(){
  blast.disabled=ammo===0;
  blast.setAttribute('aria-label','Explode nearby walls, '+ammo+' charges remaining');
  [...ammoDisplay.children].forEach((dot,i)=>dot.classList.toggle('empty',i>=ammo));
}
function explode(){
  if(ammo<=0||celebrate>0)return;
  ammo--;refreshAmmo();
  const range=2.45;
  let removed=0;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(x<cols-1&&Math.hypot(x+1-player.x,y+.5-player.y)<range)
      removed+=Number(removeWall(x,y,E));
    if(y<rows-1&&Math.hypot(x+.5-player.x,y+1-player.y)<range)
      removed+=Number(removeWall(x,y,S));
  }
  blastWave=.5;
  for(let i=0;i<35;i++){
    const angle=Math.random()*Math.PI*2,speed=90+Math.random()*250;
    particles.push({x:player.x*tileW,y:player.y*tileH,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:2+Math.random()*3,life:.35+Math.random()*.45,color:i%2?'#ffb347':'#fff3aa'});
  }
  announce.textContent=removed+' walls exploded. '+ammo+' charges left';
}
blast.addEventListener('click',explode);
function resize(){
  const oldCols=cols,oldRows=rows;
  const box=board.getBoundingClientRect();
  width=Math.max(140,box.width);height=Math.max(140,box.height);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // Many small cells and hairline walls, not the previous block-thick walls.
  cols=width<390?17:19;
  rows=clamp(Math.round(cols*height/width),17,39);
  tileW=width/cols;tileH=height/rows;
  if(oldCols>0&&oldRows>0&&walls.length){
    player.x=clamp(player.x/oldCols*cols,.5,cols-.5);
    player.y=clamp(player.y/oldRows*rows,.5,rows-.5);
  }else{player={x:.5,y:.5};}
  goal={x:cols-.5,y:rows-.5};
  generateMaze();
}
function hitsWall(x,y,r){
  const minX=Math.max(0,Math.floor(x-r)-1),maxX=Math.min(cols-1,Math.floor(x+r)+1);
  const minY=Math.max(0,Math.floor(y-r)-1),maxY=Math.min(rows-1,Math.floor(y+r)+1);
  // Shortest distance from a circle center to each maze wall segment.
  function touches(ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,lengthSq=dx*dx+dy*dy;
    const t=clamp(((x-ax)*dx+(y-ay)*dy)/lengthSq,0,1);
    return Math.hypot(x-(ax+t*dx),y-(ay+t*dy))<r;
  }
  for(let cy=minY;cy<=maxY;cy++)for(let cx=minX;cx<=maxX;cx++){
    const mask=walls[cell(cx,cy)];
    if(mask&N && touches(cx,cy,cx+1,cy))return true;
    if(mask&WEST && touches(cx,cy,cx,cy+1))return true;
    if(cx===cols-1&&(mask&E)&&touches(cx+1,cy,cx+1,cy+1))return true;
    if(cy===rows-1&&(mask&S)&&touches(cx,cy+1,cx+1,cy+1))return true;
  }
  return false;
}
function move(dt){
  let vx=joystick.x,vy=joystick.y;
  if(keys.has('arrowleft')||keys.has('a'))vx--;
  if(keys.has('arrowright')||keys.has('d'))vx++;
  if(keys.has('arrowup')||keys.has('w'))vy--;
  if(keys.has('arrowdown')||keys.has('s'))vy++;
  const magnitude=Math.hypot(vx,vy);
  if(magnitude<.03)return;
  vx/=Math.max(1,magnitude);vy/=Math.max(1,magnitude);
  const speed=5.6,r=.22;
  // Substeps avoid crossing a wall when a phone has a slow animation frame.
  const dx=vx*speed*dt,dy=vy*speed*dt,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.08));
  for(let n=0;n<steps;n++){
    if(!hitsWall(player.x+dx/steps,player.y,r))player.x+=dx/steps;
    if(!hitsWall(player.x,player.y+dy/steps,r))player.y+=dy/steps;
  }
}
function disc(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function draw(){
  const left=clamp(PERIOD-elapsed,0,PERIOD);
  const warning=clamp((WARNING-left)/WARNING,0,1),mix=warning*warning*(3-2*warning);
  // Visible floor gradually shifts from near-white to vivid red.
  const red=Math.round(250+5*mix),green=Math.round(251-182*mix),blue=Math.round(253-187*mix);
  ctx.fillStyle='rgb('+red+','+green+','+blue+')';ctx.fillRect(0,0,width,height);
  ctx.strokeStyle=warning>.5?'#4e1830':'#1c3653';
  ctx.lineWidth=clamp(Math.min(tileW,tileH)*.105,1.5,3.0);
  ctx.lineCap='square';ctx.lineJoin='miter';
  ctx.beginPath();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const mask=walls[cell(x,y)];
    const lx=x*tileW,ty=y*tileH,rx=(x+1)*tileW,by=(y+1)*tileH;
    if(mask&N){ctx.moveTo(lx,ty);ctx.lineTo(rx,ty);}
    if(mask&WEST){ctx.moveTo(lx,ty);ctx.lineTo(lx,by);}
    if(x===cols-1&&(mask&E)){ctx.moveTo(rx,ty);ctx.lineTo(rx,by);}
    if(y===rows-1&&(mask&S)){ctx.moveTo(lx,by);ctx.lineTo(rx,by);}
  }
  ctx.stroke();
  const gx=goal.x*tileW,gy=goal.y*tileH,r=Math.min(tileW,tileH);
  const halo=ctx.createRadialGradient(gx,gy,1,gx,gy,r*.9);
  halo.addColorStop(0,'#16ff83a9');halo.addColorStop(1,'#16ff8300');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(gx,gy,r*.9,0,Math.PI*2);ctx.fill();
  disc(gx,gy,r*.27,'#03975d');disc(gx,gy,r*.15,'#8effc4');
  const pr=r*.27;
  ctx.shadowBlur=10;ctx.shadowColor='#00abed';
  disc(player.x*tileW,player.y*tileH,pr,'#078acb');
  ctx.shadowBlur=0;disc(player.x*tileW-pr*.18,player.y*tileH-pr*.22,pr*.43,'#bef3ff');
  if(blastWave>0){
    const t=1-blastWave/.5;
    ctx.beginPath();ctx.arc(player.x*tileW,player.y*tileH,t*Math.min(tileW,tileH)*2.9,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,133,24,'+(1-t)+')';ctx.lineWidth=4*(1-t)+1;ctx.stroke();
  }
  for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);disc(p.x,p.y,p.r,p.color);}
  ctx.globalAlpha=1;
  // Icon-only circular countdown; no on-screen text.
  g.clearRect(0,0,100,100);
  g.beginPath();g.arc(50,50,38,0,Math.PI*2);g.lineWidth=10;g.strokeStyle='#142c43';g.stroke();
  g.beginPath();g.arc(50,50,38,-Math.PI/2,-Math.PI/2+2*Math.PI*left/PERIOD);
  g.lineWidth=10;g.lineCap='round';g.strokeStyle=warning>0?'#f43f5e':'#06a9d4';g.stroke();
  g.beginPath();g.arc(50,50,23,0,2*Math.PI);g.fillStyle='#ffffff';g.fill();
}
function update(dt){
  if(celebrate>0){
    celebrate-=dt;
    if(celebrate<=0){
      // A successful run starts again, unlike an ordinary 10-second shift.
      player={x:.5,y:.5};ammo=2;refreshAmmo();generateMaze();
    }
  }else{
    move(dt);
    elapsed+=dt;
    if(Math.hypot(player.x-goal.x,player.y-goal.y)<.34){
      celebrate=.85;announce.textContent='Finish reached';
      for(let i=0;i<24;i++)particles.push({x:goal.x*tileW,y:goal.y*tileH,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,r:2+Math.random()*3,life:1,color:i%2?'#34d399':'#fbbf24'});
    }else if(elapsed>=PERIOD){
      // The goal and player coordinates deliberately stay untouched.
      generateMaze();announce.textContent='Maze changed';
    }
  }
  blastWave=Math.max(0,blastWave-dt);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}
function setStick(e){
  const rect=stick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy,limit=rect.width*.32;
  const factor=Math.min(1,limit/Math.max(1,Math.hypot(dx,dy)));
  const x=dx*factor,y=dy*factor;
  joystick={x:x/limit,y:y/limit};
  knob.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))';
}
function release(e){
  if(pointer===null||(e&&pointer!==e.pointerId))return;
  pointer=null;joystick={x:0,y:0};knob.style.transform='translate(-50%,-50%)';
}
stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;pointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e);e.preventDefault();});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer){setStick(e);e.preventDefault();}});
stick.addEventListener('pointerup',release);
stick.addEventListener('pointercancel',release);
stick.addEventListener('lostpointercapture',()=>release(null));
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key)){keys.add(key);e.preventDefault();}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();release(null);});
new ResizeObserver(resize).observe(board);
resize();refreshAmmo();
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
