<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1825">
<meta name="description" content="Tilt a rising platform to keep a ball away from holes.">
<title>Hole Run</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0b1825}
body{display:flex;justify-content:center;align-items:center}
#game{width:100%;height:100vh;height:100dvh;max-width:540px;max-height:840px;position:relative;overflow:hidden;background:#eaf1f4;touch-action:none}
#canvas{display:block;width:100%;height:100%;touch-action:none}
#restart{position:absolute;right:13px;top:calc(13px + env(safe-area-inset-top));height:46px;width:46px;border:1px solid #ffffff88;border-radius:50%;color:#fff;background:#193d4fbb;backdrop-filter:blur(8px);font-size:26px;cursor:pointer;touch-action:manipulation;z-index:2}
#restart:focus-visible{outline:3px solid #f7c35e;outline-offset:3px}
#progress{position:absolute;left:0;right:0;top:0;height:5px;background:#0c253380;z-index:1}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#17d9c1,#e9fc83);transition:width .1s linear}
#status{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden;white-space:nowrap}
@media(min-width:700px){#game{height:min(840px,calc(100dvh - 24px));border-radius:19px;border:1px solid #36566a;box-shadow:0 25px 70px #0009}}
</style>
</head>
<body>
<main id="game" aria-label="Hole Run, a tilting platform game">
<div id="progress" aria-hidden="true"><div id="progressFill"></div></div>
<canvas id="canvas" aria-label="Drag up or down to move the platform vertically, and left or right to tilt it. Keep the ball away from the holes and reach the green goal at the top."></canvas>
<button id="restart" type="button" aria-label="Restart game">↻</button>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{
'use strict';
const game=document.getElementById('game'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const resetButton=document.getElementById('restart'),progress=document.getElementById('progressFill'),status=document.getElementById('status');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const random=(a,b)=>a+Math.random()*(b-a);
let W=400,H=700,holes=[],ball={},platform={},particles=[],pointer=null,gesture=null,state='playing',last=0,finishDelay=0;
let controls={up:false,down:false,left:false,right:false};
const goalY=()=>Math.max(55,H*.095),bottomY=()=>H*.85;
function geometry(){
  const rect=game.getBoundingClientRect();
  W=Math.max(250,rect.width);H=Math.max(360,rect.height);
  const dpr=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function generateHoles(){
  holes=[];
  const r=clamp(W*.07,18,31),count=clamp(Math.round(H/67),7,12);
  const low=goalY()+52,high=bottomY()-62;
  for(let i=0;i<count;i++){
    let placed=false;
    for(let tries=0;tries<100&&!placed;tries++){
      const x=random(r+16,W-r-16),y=random(low,high);
      if(holes.every(h=>Math.hypot(h.x-x,h.y-y)>r+h.r+clamp(W*.065,14,25))){
        holes.push({x,y,r:random(r*.83,r*1.13),phase:random(0,6.28)});placed=true;
      }
    }
  }
}
function newGame(){
  generateHoles();
  platform={y:bottomY(),angle:0,length:W*.61,thickness:12};
  ball={u:0,velocity:0,r:clamp(W*.032,11,17),x:W/2,y:bottomY()-17,fallVx:0,fallVy:0,spin:0};
  particles=[];pointer=null;gesture=null;state='playing';finishDelay=0;
  progress.style.width='0%';
  status.textContent='Game started';
}
function ballPosition(){
  const a=platform.angle,c=Math.cos(a),s=Math.sin(a);
  return{x:W/2+ball.u*c+ball.r*s,y:platform.y+ball.u*s-ball.r*c};
}
function beginGesture(e){
  if(state!=='playing')return;
  if(pointer!==null)return;
  pointer=e.pointerId;
  gesture={x:e.clientX,y:e.clientY,platformY:platform.y,angle:platform.angle};
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
}
canvas.addEventListener('pointerdown',beginGesture);
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointer||!gesture||state!=='playing')return;
  const dy=e.clientY-gesture.y,dx=e.clientX-gesture.x;
  platform.y=clamp(gesture.platformY+dy,goalY()+16,bottomY());
  platform.angle=clamp(gesture.angle+dx/(W*.58),-.52,.52);
  e.preventDefault();
});
function endGesture(e){if(pointer!==e.pointerId)return;pointer=null;gesture=null;}
canvas.addEventListener('pointerup',endGesture);
canvas.addEventListener('pointercancel',endGesture);
canvas.addEventListener('lostpointercapture',()=>{pointer=null;gesture=null;});
resetButton.addEventListener('click',newGame);
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','r'].includes(key))e.preventDefault();
  if(key==='r'){newGame();return;}
  if(key==='arrowup'||key==='w')controls.up=true;
  if(key==='arrowdown'||key==='s')controls.down=true;
  if(key==='arrowleft'||key==='a')controls.left=true;
  if(key==='arrowright'||key==='d')controls.right=true;
});
window.addEventListener('keyup',e=>{
  const key=e.key.toLowerCase();
  if(key==='arrowup'||key==='w')controls.up=false;
  if(key==='arrowdown'||key==='s')controls.down=false;
  if(key==='arrowleft'||key==='a')controls.left=false;
  if(key==='arrowright'||key==='d')controls.right=false;
});
window.addEventListener('blur',()=>{controls={up:false,down:false,left:false,right:false};});
function puff(x,y,color,count=22){
  for(let i=0;i<count;i++){
    const a=random(0,Math.PI*2),v=random(55,210);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:random(.35,.85),color,r:random(2,6)});
  }
}
function fail(){
  if(state!=='playing')return;
  state='falling';finishDelay=1.1;
  ball.fallVx=ball.velocity*Math.cos(platform.angle);
  ball.fallVy=45;
  puff(ball.x,ball.y,'#f39b52',28);
  status.textContent='Ball fell. Restarting';
}
function win(){
  if(state!=='playing')return;
  state='won';finishDelay=1.15;
  puff(ball.x,ball.y,'#2bc88d',46);
  progress.style.width='100%';
  status.textContent='Goal reached';
}
function update(dt){
  if(state==='playing'){
    if(controls.up)platform.y-=H*.55*dt;
    if(controls.down)platform.y+=H*.55*dt;
    if(controls.left)platform.angle-=1.4*dt;
    if(controls.right)platform.angle+=1.4*dt;
    platform.y=clamp(platform.y,goalY()+16,bottomY());
    platform.angle=clamp(platform.angle,-.52,.52);
    const acceleration=1150*Math.sin(platform.angle);
    ball.velocity+=acceleration*dt;
    ball.velocity*=Math.pow(.992,dt*60);
    ball.velocity=clamp(ball.velocity,-W*.8,W*.8);
    ball.u+=ball.velocity*dt;
    ball.spin+=ball.velocity*dt/ball.r;
    const p=ballPosition();ball.x=p.x;ball.y=p.y;
    const maxU=platform.length/2-ball.r*.45;
    if(Math.abs(ball.u)>maxU){fail();}
    else{
      for(const h of holes){
        if(Math.hypot(ball.x-h.x,ball.y-h.y)<h.r*.77){
          fail();break;
        }
      }
      if(state==='playing'&&ball.y<goalY()+22)win();
    }
    const p=clamp((bottomY()-platform.y)/(bottomY()-goalY()-16),0,1);
    progress.style.width=(p*100).toFixed(1)+'%';
  }else if(state==='falling'){
    ball.fallVy+=1500*dt;ball.x+=ball.fallVx*dt;ball.y+=ball.fallVy*dt;ball.r=Math.max(1,ball.r*(1-dt*1.8));
    finishDelay-=dt;if(finishDelay<=0)newGame();
  }else if(state==='won'){
    finishDelay-=dt;if(finishDelay<=0)newGame();
  }
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}
function disc(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#f4fbf6');bg.addColorStop(.55,'#ebf1f4');bg.addColorStop(1,'#dce8ef');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1;
  ctx.strokeStyle='#b2c6d344';
  const gap=clamp(W/12,23,39);
  for(let x=0;x<=W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Goal zone stays fixed at the top.
  const goal=goalY();
  ctx.fillStyle='#4fe0a5';ctx.fillRect(0,0,W,goal+11);
  ctx.fillStyle='#15976b';ctx.fillRect(0,goal+7,W,5);
  for(let x=15;x<W;x+=31){
    ctx.fillStyle='#ffffffaa';
    ctx.beginPath();ctx.moveTo(x,goal-15);ctx.lineTo(x+7,goal-9);ctx.lineTo(x,goal-3);ctx.fill();
  }
  // Recessed holes with a thin luminous rim.
  holes.forEach(h=>{
    ctx.save();
    ctx.shadowColor='#31434b70';ctx.shadowBlur=9;ctx.shadowOffsetY=5;
    disc(h.x,h.y,h.r+3,'#93a9b4');
    ctx.restore();
    const gradient=ctx.createRadialGradient(h.x-h.r*.15,h.y-h.r*.25,h.r*.1,h.x,h.y,h.r);
    gradient.addColorStop(0,'#07111e');gradient.addColorStop(.8,'#112739');gradient.addColorStop(1,'#3e586a');
    disc(h.x,h.y,h.r,gradient);
    ctx.lineWidth=2;ctx.strokeStyle='#a7bac6';
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke();
  });
  // Platform rotates around the middle while the finger moves it vertically.
  ctx.save();ctx.translate(W/2,platform.y);ctx.rotate(platform.angle);
  ctx.shadowColor='#07283b66';ctx.shadowBlur=13;ctx.shadowOffsetY=6;
  ctx.fillStyle='#102d43';ctx.beginPath();ctx.roundRect(-platform.length/2,-4,platform.length,platform.thickness,6);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.fillStyle='#48d7eb';ctx.beginPath();ctx.roundRect(-platform.length/2,-6,platform.length,4,2);ctx.fill();
  ctx.fillStyle='#a9f2f8';ctx.beginPath();ctx.roundRect(-platform.length/2+8,-4,platform.length-16,1.5,1);ctx.fill();
  ctx.restore();
  if(ball.r>1){
    ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.spin);
    ctx.shadowColor='#265e88aa';ctx.shadowBlur=15;ctx.shadowOffsetY=4;
    const grad=ctx.createRadialGradient(-ball.r*.4,-ball.r*.5,1,0,0,ball.r);
    grad.addColorStop(0,'#f1fcff');grad.addColorStop(.34,'#65c6ef');grad.addColorStop(1,'#11639b');
    disc(0,0,ball.r,grad);
    ctx.shadowBlur=0;ctx.strokeStyle='#e1f7ff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.stroke();
    disc(-ball.r*.3,-ball.r*.36,ball.r*.21,'#ffffffb0');
    ctx.restore();
  }
  for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);disc(p.x,p.y,p.r,p.color);}
  ctx.globalAlpha=1;
  if(state==='won'){
    ctx.fillStyle='#31da99aa';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.min(W*.28,110)+'px system-ui';
    ctx.fillText('★',W/2,H/2);
  }
}
function resize(){
  const wasPlaying=state==='playing';
  const oldW=W,oldH=H;
  geometry();
  if(oldW!==W||oldH!==H){
    if(wasPlaying&&platform.length){
      const fraction=clamp((bottomY()-(platform.y/oldH)*H)/(bottomY()-goalY()-16),0,1);
      platform.y=bottomY()-fraction*(bottomY()-goalY()-16);
      platform.length=W*.61;
      ball.u*=W/oldW;
      holes.forEach(h=>{h.x=h.x/oldW*W;h.y=h.y/oldH*H;h.r=h.r/oldW*W;});
    }else newGame();
  }
}
new ResizeObserver(resize).observe(game);
geometry();newGame();
function frame(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
