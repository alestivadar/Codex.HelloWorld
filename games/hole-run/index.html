<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1825">
<title>Hole Run</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1825;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;height:100vh;height:100dvh;max-width:540px;max-height:840px;overflow:hidden;background:#eaf1f4;touch-action:none}
#canvas{display:block;width:100%;height:100%;touch-action:none;background:linear-gradient(#f2fafc,#dce9ee)}
#restart{position:absolute;right:13px;top:calc(13px + env(safe-area-inset-top));width:46px;height:46px;border:1px solid #ffffff88;border-radius:50%;color:white;background:#21485fcc;font-size:26px;z-index:2}
#progress{position:absolute;left:0;top:0;width:100%;height:5px;background:#46697c60;z-index:1}
#fill{height:100%;width:0;background:#15b88e}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:700px){#game{height:min(840px,calc(100dvh - 24px));border-radius:20px;border:1px solid #36566a;box-shadow:0 25px 70px #0009}}
</style>
</head>
<body>
<main id="game" aria-label="Hole Run balance game">
<div id="progress"><div id="fill"></div></div>
<canvas id="canvas" aria-label="Raise the platform by dragging up, tilt it by dragging left or right. Avoid holes and reach the green top."></canvas>
<button id="restart" type="button" aria-label="Restart game">↻</button>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
'use strict';
var game=document.getElementById('game'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
var fill=document.getElementById('fill'),status=document.getElementById('status');
var w=0,h=0,holes=[],platform={},ball={},mode='play',pointer=-1,drag=null,last=0,wait=0;
var keys={};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}
function topY(){return Math.max(43,h*.09);}
function bottomY(){return h*.85;}
function size(){
  var r=game.getBoundingClientRect(),nw=Math.max(200,r.width),nh=Math.max(300,r.height);
  if(Math.abs(nw-w)<1&&Math.abs(nh-h)<1)return;
  w=nw;h=nh;
  var dpi=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpi);canvas.height=Math.round(h*dpi);
  ctx.setTransform(dpi,0,0,dpi,0,0);
  restart();
}
function restart(){
  holes=[];
  var rad=clamp(w*.064,17,28),count=clamp(Math.floor(h/70),6,11);
  for(var i=0;i<count;i++){
    for(var j=0;j<70;j++){
      var x=rand(rad+12,w-rad-12),y=rand(topY()+65,bottomY()-55);
      if(holes.every(function(a){return Math.hypot(a.x-x,a.y-y)>a.r+rad+18;})){
        holes.push({x:x,y:y,r:rand(rad*.86,rad*1.08)});break;
      }
    }
  }
  platform={y:bottomY(),angle:0,length:w*.68};
  ball={offset:0,speed:0,r:clamp(w*.034,11,17),x:w/2,y:bottomY()-15,vy:0,vx:0};
  mode='play';wait=0;drag=null;pointer=-1;
  fill.style.width='0%';status.textContent='Playing';
}
function position(){
  var a=platform.angle,c=Math.cos(a),s=Math.sin(a);
  return{x:w/2+ball.offset*c+ball.r*s,y:platform.y+ball.offset*s-ball.r*c};
}
function finish(success){
  if(mode!=='play')return;
  mode=success?'won':'lost';wait=1;
  ball.vx=ball.speed;ball.vy=50;
  status.textContent=success?'Goal reached':'Ball fell';
}
function update(dt){
  if(mode==='play'){
    if(keys.ArrowUp||keys.w)platform.y-=h*.54*dt;
    if(keys.ArrowDown||keys.s)platform.y+=h*.54*dt;
    if(keys.ArrowLeft||keys.a)platform.angle-=dt*1.5;
    if(keys.ArrowRight||keys.d)platform.angle+=dt*1.5;
    platform.y=clamp(platform.y,topY()+20,bottomY());
    platform.angle=clamp(platform.angle,-.52,.52);
    ball.speed+=Math.sin(platform.angle)*1200*dt;
    ball.speed*=Math.pow(.988,dt*60);
    ball.speed=clamp(ball.speed,-w*.95,w*.95);
    ball.offset+=ball.speed*dt;
    var p=position();ball.x=p.x;ball.y=p.y;
    if(Math.abs(ball.offset)>platform.length/2-ball.r*.4){finish(false);}
    for(var i=0;i<holes.length&&mode==='play';i++){
      var a=holes[i];
      if(Math.hypot(ball.x-a.x,ball.y-a.y)<a.r*.88)finish(false);
    }
    if(mode==='play'&&ball.y<topY()+23)finish(true);
    fill.style.width=(100*clamp((bottomY()-platform.y)/(bottomY()-topY()-20),0,1))+'%';
  }else{
    wait-=dt;
    if(mode==='lost'){ball.vy+=1050*dt;ball.y+=ball.vy*dt;ball.x+=ball.vx*dt;ball.r*=Math.max(.01,1-dt*1.7);}
    if(wait<=0)restart();
  }
}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function draw(){
  ctx.clearRect(0,0,w,h);
  var grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#f5fcfd');grad.addColorStop(1,'#d8e7ec');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#b9cbd35a';ctx.lineWidth=1;
  var step=clamp(w/12,25,42);
  for(var x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(var y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.fillStyle='#5bdca8';ctx.fillRect(0,0,w,topY()+10);
  ctx.fillStyle='#159b70';ctx.fillRect(0,topY()+7,w,5);
  holes.forEach(function(a){
    circle(a.x,a.y,a.r+4,'#9aafb9');
    var g=ctx.createRadialGradient(a.x,a.y,2,a.x,a.y,a.r);
    g.addColorStop(0,'#06101d');g.addColorStop(.85,'#0f2638');g.addColorStop(1,'#425d6b');
    circle(a.x,a.y,a.r,g);
  });
  ctx.save();ctx.translate(w/2,platform.y);ctx.rotate(platform.angle);
  ctx.lineCap='round';
  ctx.strokeStyle='#193c53';ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(-platform.length/2,0);ctx.lineTo(platform.length/2,0);ctx.stroke();
  ctx.strokeStyle='#48d8eb';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-platform.length/2,-4);ctx.lineTo(platform.length/2,-4);ctx.stroke();
  ctx.restore();
  if(ball.r>1){
    var b=ctx.createRadialGradient(ball.x-ball.r*.4,ball.y-ball.r*.4,1,ball.x,ball.y,ball.r);
    b.addColorStop(0,'#edfdff');b.addColorStop(.5,'#5dc4ee');b.addColorStop(1,'#125e97');
    ctx.shadowColor='#2175a5';ctx.shadowBlur=12;
    circle(ball.x,ball.y,ball.r,b);
    ctx.shadowBlur=0;circle(ball.x-ball.r*.28,ball.y-ball.r*.32,ball.r*.18,'#f8ffff');
  }
  if(mode==='won'){
    ctx.fillStyle='#1cce8b66';ctx.fillRect(0,0,w,h);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 95px system-ui';ctx.fillStyle='#fff';
    ctx.fillText('★',w/2,h/2);
  }
}
function point(e){return{x:e.clientX,y:e.clientY};}
canvas.addEventListener('pointerdown',function(e){
  if(mode!=='play'||pointer!==-1)return;
  pointer=e.pointerId;
  drag={x:e.clientX,y:e.clientY,startY:platform.y,startAngle:platform.angle};
  canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',function(e){
  if(pointer!==e.pointerId||!drag||mode!=='play')return;
  platform.y=clamp(drag.startY+e.clientY-drag.y,topY()+20,bottomY());
  platform.angle=clamp(drag.startAngle+(e.clientX-drag.x)/(w*.55),-.52,.52);
  e.preventDefault();
});
function stop(e){if(e.pointerId===pointer){pointer=-1;drag=null;}}
canvas.addEventListener('pointerup',stop);
canvas.addEventListener('pointercancel',stop);
canvas.addEventListener('lostpointercapture',function(){pointer=-1;drag=null;});
document.getElementById('restart').addEventListener('click',restart);
window.addEventListener('keydown',function(e){
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].indexOf(e.key)>=0){keys[e.key]=true;e.preventDefault();}
  if(e.key==='r'||e.key==='R')restart();
});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
window.addEventListener('blur',function(){keys={};});
window.addEventListener('resize',size);
size();draw();
function frame(t){
  var dt=Math.min(.035,(t-last)/1000||.016);last=t;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
